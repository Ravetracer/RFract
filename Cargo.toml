[workspace]
resolver = "3"
members = ["crates/rfr-core", "crates/rfr-gpu", "crates/rfr-app", "crates/rfr-cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Ravetracer/RFract"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
# File and line numbers only: keeps target/ small.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
