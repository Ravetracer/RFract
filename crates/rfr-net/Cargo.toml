[package]
name = "rfr-net"
description = "RFract network rendering: render clients on the local network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
png = "0.18"
rfr-core = { path = "../rfr-core" }
rfr-gpu = { path = "../rfr-gpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "network"] }
