[package]
name = "rfr-core"
description = "RFract core: document model, formulas, CPU renderer, denoiser glue, IO"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
png = "0.18"
dashu-float = "0.6.2"
dashu-int = "0.6.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
